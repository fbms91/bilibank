<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bilibank">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<title>Bilibank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma tela. Barra lateral no desktop, barra inferior no celular.
   Fundo preto puro. Logo, botões e navegação em preto e branco; as cores ficam para separar
   contas, séries e alertas, e o dourado para o número que manda no dia. */
:root{
  color-scheme:dark;
  --bg:#000000;
  --panel:#0b0b0c;
  --panel-2:#111113;
  --raise:#1a1a1d;
  --line:#1e1e21;
  --line-2:#2b2b2f;
  --text:#f4f4f1;
  --text-2:#a3a29b;
  --text-3:#76756f;
  --gold:#ffc709;
  --gold-ink:#0a0a0a;
  --gold-soft:rgba(255,199,9,.10);
  --gold-line:rgba(255,199,9,.40);
  --btn:#f4f4f1;
  --btn-ink:#000000;
  --btn-soft:rgba(255,255,255,.08);
  --btn-line:rgba(255,255,255,.32);
  --pos:#4ade80;
  --neg:#ff6b6b;
  --pos-soft:rgba(74,222,128,.11);
  --neg-soft:rgba(255,107,107,.12);
  --c-pessoal:#3987e5;
  --c-beecom:#d95926;
  --c-musica:#199e70;
  --c-invest:#9085e9;
  --f-display:"Sora","Hanken Grotesk",system-ui,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
  --r-sm:10px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--btn);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}
.neg{color:var(--neg)}
.muted{color:var(--text-2)}
.faint{color:var(--text-3)}
.gold{color:var(--gold)}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- casca ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:28px;border-right:1px solid var(--line);
  padding-block:28px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:20px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font:700 17px/1 var(--f-display);letter-spacing:0}
.brand-name{font:600 16px/1.1 var(--f-display);letter-spacing:-.01em}
.brand-name span{display:block;font:500 12px/1.3 var(--f-body);color:var(--text-3);letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--text-2);font-weight:500;text-align:left}
.nav button:hover{background:var(--panel-2);color:var(--text)}
.nav button[aria-current="page"]{background:var(--raise);color:var(--text)}
.nav button[aria-current="page"] svg{color:var(--text)}
.side .btn-gold{width:100%;justify-content:center}
.side-foot{margin-top:auto;font-size:12.5px;color:var(--text-3);line-height:1.5}

.main{min-width:0;padding-left:max(clamp(16px,3vw,40px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,3vw,40px),env(safe-area-inset-right,0px));padding-bottom:64px}
.wrap{max-width:1180px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(0,0,0,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  margin-inline:calc(-1*max(clamp(16px,3vw,40px),env(safe-area-inset-left,0px)));padding-inline:max(clamp(16px,3vw,40px),env(safe-area-inset-left,0px));border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px}
.top h1{margin:0;font:600 clamp(22px,2.4vw,28px)/1.15 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.top .sub{margin-top:4px;font-size:13px;color:var(--text-2)}
.top-actions{display:flex;align-items:center;gap:10px}
.pill-ex{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text);border:1px solid var(--btn-line);border-radius:999px;padding:5px 10px;white-space:nowrap}
.pill-ex::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--text)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--text-2)}
.icon-btn:hover{color:var(--text);border-color:var(--text-3)}

/* ---------- peças ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-h h2{margin:0;font:600 15px/1.3 var(--f-body);letter-spacing:0}
.link{font-size:13px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:4px}
.link:hover{color:var(--text)}
.link svg.i{width:16px;height:16px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.btn-gold{display:inline-flex;align-items:center;gap:8px;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:14.5px;padding:12px 18px;border-radius:999px;white-space:nowrap}
.btn-gold:hover{background:#ffffff}
.btn-gold svg.i{stroke-width:2.2}
.btn-gold[disabled]{opacity:.5;cursor:default}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);color:var(--text);font-weight:600;font-size:14px;padding:11px 16px;border-radius:999px;white-space:nowrap}
.btn-ghost:hover{border-color:var(--text-3)}
.btn-sm{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);color:var(--text);white-space:nowrap}
.btn-sm:hover{border-color:var(--btn-line);color:var(--text);background:var(--btn-soft)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.d-pessoal{background:var(--c-pessoal)}.d-beecom{background:var(--c-beecom)}.d-musica{background:var(--c-musica)}.d-investimentos{background:var(--c-invest)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--text-2)}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:#000}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.st{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.st-late{color:var(--neg);background:var(--neg-soft)}
.st-ok{color:var(--pos);background:var(--pos-soft)}
.st-soon{color:var(--gold);background:var(--gold-soft)}
.st-pend{color:var(--text-2);border-color:var(--line-2)}
.st-int{color:var(--text-2);background:var(--panel-2);border-color:var(--line)}
.st svg.i{width:13px;height:13px;margin-right:5px}
.tag{font-size:12px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:6px}
.bar{height:6px;border-radius:999px;background:var(--panel-2);overflow:hidden;display:flex;gap:2px}
.bar > i{display:block;height:100%;border-radius:999px}
.note{font-size:13px;color:var(--text-2);line-height:1.5}

.view{display:grid;gap:16px;padding-top:8px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
.stack{display:grid;gap:16px;align-content:start}

/* ---------- início ---------- */
.hero{position:relative;overflow:hidden;padding:28px;background:radial-gradient(120% 150% at 100% 0%,rgba(255,199,9,.13),rgba(255,199,9,0) 52%),var(--panel)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.big{font:600 clamp(38px,6vw,60px)/1.02 var(--f-display);letter-spacing:-.03em;margin:14px 0 18px;font-variant-numeric:tabular-nums}
.math{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.math span{display:block;font-size:12.5px;color:var(--text-2)}
.math b{display:block;margin-top:4px;font:600 17px/1.2 var(--f-body);font-variant-numeric:tabular-nums}
.hero-note{margin:14px 0 20px;font-size:13.5px;color:var(--text-2);max-width:62ch}
.hero-note b{color:var(--text);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.hero-flow{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.flow-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap;margin-bottom:6px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}
.kv b{font-weight:600;font-variant-numeric:tabular-nums}
.pl-num{font:600 30px/1.1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.delta{font-size:13px;font-weight:600}
.spark{height:64px;margin-top:10px}
.centros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.centro .c-name{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--text-2)}
.centro .c-val{font:600 24px/1.15 var(--f-display);letter-spacing:-.02em;margin:10px 0 12px;font-variant-numeric:tabular-nums}
.centro .c-lines{display:grid;gap:6px;font-size:13px;color:var(--text-2)}
.centro .c-lines div{display:flex;justify-content:space-between;gap:8px}
.centro .c-lines b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.alert:first-child{border-top:0;padding-top:0}
.alert .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);color:var(--text-2)}
.alert .ic.warn{color:var(--neg);background:var(--neg-soft)}
.alert .ic.idea{color:var(--gold);background:var(--gold-soft)}
.alert p{margin:0;font-size:14px}
.alert p b{font-weight:600}
.alert .a-act{margin-top:8px}

/* ---------- listas ---------- */
.rows{display:grid}
.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.rows > .row:first-child{border-top:0}
.datebox{width:48px;height:50px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-content:center;text-align:center}
.datebox b{font:600 17px/1 var(--f-display)}
.datebox span{font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;margin-top:3px}
.datebox.late{border-color:rgba(255,107,107,.45)}
.r-main{min-width:0}
.r-title{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:4px;font-size:12.5px;color:var(--text-2)}
.r-meta .tag{font-weight:500}
.r-right{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.r-val{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.group-h{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 4px;padding-top:6px}
.group-h h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-2)}
.group-h span{font-size:12.5px;color:var(--text-3)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi .k-l{font-size:12.5px;color:var(--text-2)}
.kpi .k-v{font:600 22px/1.2 var(--f-display);letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:12.5px;color:var(--text-3);margin-top:4px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line-2);border-radius:999px;padding:8px 14px;min-width:0;flex:1 1 220px;max-width:340px}
.search input{background:none;border:0;outline:none;min-width:0;width:100%;font-size:14px}
.search svg.i{width:17px;height:17px;color:var(--text-3)}
.hbar{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) auto;align-items:center;gap:12px;padding:7px 0;font-size:13.5px}
.hbar .lbl{color:var(--text-2);overflow-wrap:anywhere;line-height:1.3}
.hbar .trk{height:8px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.hbar .trk i{display:block;height:100%;border-radius:999px;background:var(--text-2)}
.hbar b{font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- lançar ---------- */
.composer{background:var(--panel);border:1px solid var(--line-2);border-radius:20px;padding:6px;transition:border-color .2s}
.composer:focus-within{border-color:var(--btn-line)}
.composer textarea{display:block;width:100%;min-height:118px;resize:vertical;background:none;border:0;outline:none;padding:16px 16px 8px;font:500 clamp(18px,2.2vw,22px)/1.4 var(--f-body);color:var(--text)}
.composer textarea::placeholder{color:var(--text-3)}
.composer-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 14px;flex-wrap:wrap}
.mic-hint{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-2)}
.mic-hint .mic{width:34px;height:34px;border-radius:50%;background:var(--btn-soft);color:var(--text);display:grid;place-items:center;flex:none}
.mic-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;background:var(--btn-soft);border:1px solid var(--btn-line);color:var(--text);font-weight:600;font-size:14px}
.mic-btn svg.i{width:26px;height:26px;padding:5px;border-radius:50%;background:var(--btn);color:var(--btn-ink)}
.mic-btn.on svg.i{animation:pulse 1s ease-in-out infinite}
.mic-btn.on{background:var(--btn);color:var(--btn-ink)}
.mic-btn.on svg.i{background:var(--btn-ink);color:var(--btn)}
.dita{display:flex;gap:10px;align-items:flex-start;padding:2px 14px 12px;font-size:13.5px;line-height:1.45;color:var(--text-2)}
.dita .pulse{margin-top:5px;flex:none}
.dita b{color:var(--text)}
.aj{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 16px;margin-top:14px}
.aj .aj-info{grid-column:1/-1;margin:0}
.confirm{border:1px solid var(--gold-line);background:var(--panel);border-radius:var(--r);padding:20px}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 16px;margin-top:14px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}
.field input,.field select{width:100%;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14.5px;font-weight:500;outline:none}
.field input:focus,.field select:focus{border-color:var(--btn-line)}
.field.wide{grid-column:span 2}
.ask{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--gold-soft);border:1px solid var(--gold-line)}
.ask p{margin:0 0 10px;font-weight:600}
.via{font-size:12px;color:var(--text-3)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--text-2);font-size:14px;padding:18px 4px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--gold);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.how h3{margin:8px 0 6px;font-size:14.5px}
.how p{margin:0;font-size:13.5px;color:var(--text-2)}
.how .n{font:600 13px/1 var(--f-display);color:var(--gold)}

/* ---------- gráficos ---------- */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:var(--f-body)}
.tip{position:absolute;pointer-events:none;z-index:5;background:var(--text);color:#000;font-size:12.5px;line-height:1.35;padding:8px 10px;border-radius:9px;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));box-shadow:0 6px 24px rgba(0,0,0,.5)}
.tip b{font-weight:700}
.tip[hidden]{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--text-2);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend svg{width:22px;height:8px}
.table-wrap{overflow-x:auto;margin-inline:-4px}
.ptab{width:100%;border-collapse:collapse;font-size:13.5px;min-width:620px}
.ptab th{text-align:right;font-size:12px;font-weight:600;color:var(--text-2);padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.ptab th:first-child{text-align:left}
.ptab td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.ptab td:first-child{text-align:left;color:var(--text-2);white-space:normal;min-width:190px}
.ptab tr.sec td{color:var(--text);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding-top:16px;border-bottom:0}
.ptab tr.tot td{font-weight:600;color:var(--text)}
.ptab tr.ini td,.ptab tr.fim td{font-weight:700;color:var(--text)}
.ptab tr.fim td{border-top:1px solid var(--line-2);border-bottom:0;font-size:15px}
.ptab .st{margin-left:6px}

/* ---------- celular ---------- */
.tabbar{display:none}
.more{position:fixed;z-index:35;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--panel-2);border:1px solid var(--line-2);border-radius:14px;padding:6px;min-width:210px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.more button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--text)}
.more button:hover{background:var(--raise)}
.toast{position:fixed;z-index:50;left:0;right:0;margin-inline:auto;width:max-content;bottom:calc(28px + env(safe-area-inset-bottom,0px));background:var(--text);color:#000;border-radius:14px;padding:12px 14px 12px 16px;display:flex;align-items:center;gap:14px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 10px 40px rgba(0,0,0,.6)}

/* ===================== estado e dados =====================

/* ===================== regras de cálculo ===================== */
const MOV = ['aporte', 'resgate', 'transf'];
const TIPOS = { receita: 'Receita', despesa: 'Despesa', fatura: 'Pagamento de fatura', aporte: 'Guardar na reserva', resgate: 'Tirar da reserva', rendimento: 'Rendimento', transf: 'Transferência', ajuste: 'Ajuste de saldo' };
const TIPOS_FORM = Object.fromEntries(Object.entries(TIPOS).filter(([k]) => k !== 'ajuste'));
const contas = () => (S.cfg && S.cfg.contas) || {};
const ordC = (a, b) => num(contas()[a].ordem) - num(contas()[b].ordem);
const idsCaixa = () => Object.keys(contas()).filter(k => contas()[k].tipo === 'corrente').sort(ordC);
const idsReserva = () => Object.keys(contas()).filter(k => contas()[k].tipo === 'reserva').sort(ordC);

  let f = { d: (S.cfg && (S.cfg.saldoEm || S.cfg.inicio)) || TODAY, c: '', v: num((contas()[id] || {}).saldo), cfg: true };

const avulsos = () => S.lanc.filter(l => l.status === 'previsto' && !fixaDoRef(l.ref));

/* valor por cenário: 0 conservador, 1 base, 2 otimista */
function vCen(it, i) {

/* efeito no dinheiro em conta: +1 entra, −1 sai, 0 não mexe */

/* o que ainda não tem valor na projeção, para os textos */

/* simulação dia a dia até o fim do horizonte, por cenário */
const simCache = {};

  const meses = [], dias = [];

    const ini = cx, rows = [], faltaValor = [], evs = [];
    for (const it of itensMes(k)) {
      if (semValor(it)) { faltaValor.push(it.desc); continue; }
      const v = vCen(it, i), sg = sentido(it), rv = efReserva(it);
      let d = it.data || (k === MES_ATUAL ? TODAY : k + '-01');

      if (t && v) rows.push({ g: grupoDe(it), t, v: sg * v });

    evs.sort((a, b) => a.d.localeCompare(b.d) || b.v - a.v);

    for (const e of evs) {

/* quanto de gasto ainda não mapeado cabe por mês sem a conta ficar negativa */

/* patrimônio */
const faturaF = () => S.fixas.find(f => f.tipo === 'fatura' && f.ativo !== false);

function alertas() {
  const out = [];
  const A = (ic, cls, html, btn) => `<div class="alert"><div class="ic ${cls}">${icon(ic)}</div><div><p>${html}</p>${btn ? `<div class="a-act">${btn}</div>` : ''}</div></div>`;
  for (const it of itensMes(MES_ATUAL).filter(x => grupoP(x) === 'atraso' && sentido(x) < 0))
    out.push(A('warn', 'warn', `<b>${esc(it.desc)}</b> está em atraso (${money(vCen(it, 1))}). ${esc(it.nota || 'Pagar logo evita multa e juros.')}`, `<button class="btn-sm" type="button" data-baixa="${esc(it.id)}">Já paguei</button>`));
  const s0 = simular(0), mt = meta();
  if (mt && mt.plano.length) out.push(A('target', 'idea', `Para a meta de <b>${money(num(mt.valor))}</b> até ${dm(mt.ate)}: guardar ${mt.plano.map(p => `<b>${money(num(p.valor))}</b> em ${dm(p.data)}`).join(', ')}. Mesmo no cenário conservador, a conta não fica abaixo de <b>${money(s0.minG.v)}</b>.`, '<button class="btn-sm" type="button" data-go="projecao">Ver projeção</button>'));
  const fg = folga(s0);
  if (fg != null) out.push(A('idea', 'idea', `${cap(foraTxt())} ainda não entraram na conta. Eles podem somar até <b>${money(fg)} por mês</b> sem deixar a conta negativa, já guardando para a meta.`));
  const conf = paraConfirmar();
  if (conf.length) out.push(A('ask', '', `<b>${conf.length} pontos esperando sua confirmação.</b> ${conf.slice(0, 3).map(c => esc(c.txt)).join('; ')}${conf.length > 3 ? '; e outros.' : '.'}`, '<button class="btn-sm" type="button" data-go="fixas">Ver contas fixas</button>'));
  const rv = contas()[resId()];
  if (rv && rv.rendMes && rv.saldo && rv.rendMes / rv.saldo > 0.015)
    out.push(A('clock', '', `${money(num(rv.rendMes))} por mês sobre ${money(num(rv.saldo))} dá cerca de ${(rv.rendMes / rv.saldo * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}% ao mês, bem acima do que a renda fixa costuma pagar. Vale confirmar onde está aplicado.`));
  return out.slice(0, 5);
}

/* ===================== pendências ===================== */
function rowPend(it) {
  const sg = sentido(it), v = vCen(it, 1), g = grupoP(it), late = g === 'atraso';
  const ap = MOV.includes(it.tipo), rec = sg > 0;
  const d = it.data ? parseD(it.data) : null;
  const box = d ? `<div class="datebox${late ? ' late' : ''}"><b>${d.getDate()}</b><span>${MES[d.getMonth()]}</span></div>`
    : `<div class="datebox${late ? ' late' : ''}"><b>${late ? '!' : '?'}</b><span>${late ? 'atraso' : 'dia'}</span></div>`;
  const st = late ? `<span class="st st-late">${it.data ? prazo(it.data).replace(/<[^>]+>/g, '') : 'Atrasado'}</span>` : it.data ? prazo(it.data) : '<span class="st st-pend">Dia a confirmar</span>';
  const conf = it.confirmar ? `<span class="st st-conf" title="${esc(it.confirmar)}">Confirmar</span>` : '';
  const faixa = it.est && it._f && it._f.min != null ? `<span>entre ${moneyK(num(it._f.min))} e ${moneyK(num(it._f.max))}</span>` : '';
  const valTxt = semValor(it) ? '<span class="faint">valor a informar</span>' : `${it.est ? '≈ ' : ''}${money(ap ? -v : sg * v, !ap)}`;
  const btn = isCartao(it.conta) ? '<span class="st st-int">Entra na fatura</span>'
    : `<button class="btn-sm" type="button" data-baixa="${esc(it.id)}">${ap ? 'Guardei' : rec ? 'Recebi' : 'Paguei'}</button>`;
  return `<div class="row">${box}
    <div class="r-main"><div class="r-title">${esc(it.desc)}</div>
      <div class="r-meta"><span>${esc(it.cat || TIPOS[it.tipo] || '')}</span>${tagParcela(it)}${it.conta ? `<span>${esc(contaNome(it.conta))}</span>` : ''}${faixa}${st}${conf}</div></div>
    <div class="r-right"><span class="r-val ${rec ? 'pos' : late ? 'neg' : ''}">${valTxt}</span>${btn}</div>
  </div>`;
}
function vPendencias() {

  <div class="kpis">

    <section class="card kpi"><div class="k-l">A receber até ${dm(MES_FIM)}</div><div class="k-v pos">${money(R.receber)}</div><div class="k-s">${R.nReceber} recebimentos</div></section>
    <section class="card kpi"><div class="k-l">Atrasados</div><div class="k-v ${atr.length ? 'neg' : ''}">${atr.length}</div><div class="k-s">${atr.length ? money(soma(atr)) + ' no total' : 'Tudo em dia'}</div></section>
    <section class="card kpi"><div class="k-l">Vencendo em 7 dias</div><div class="k-v">${semana.length}</div><div class="k-s">${money(soma(semana))}</div></section>
  </div>

  </section>`;

/* ===================== contas fixas ===================== */
function vFixas() {
  if (!pronto()) return vEstado();
  const mi = S.f.fxMes, k = MESES[mi], [y, m] = k.split('-').map(Number);
  const occ = ocorrencias(k);
  const desp = occ.filter(x => x.tipo === 'despesa' || x.tipo === 'fatura').sort((a, b) => (a.data || '9999').localeCompare(b.data || '9999'));
  const rec = occ.filter(x => x.tipo === 'receita').sort((a, b) => (a.data || '9999').localeCompare(b.data || '9999'));
  const noCartao = ativas().filter(f => f.cartao);
  const vv = x => x.status === 'realizado' ? num(x.valor) : semValor(x) ? 0 : vCen(x, 1);
  const feito = x => x.status === 'realizado' || x.status === 'anterior';
  const total = desp.reduce((t, x) => t + vv(x), 0), pago = desp.filter(feito).reduce((t, x) => t + vv(x), 0);
  const semFat = desp.filter(x => x.tipo !== 'fatura').reduce((t, x) => t + vv(x), 0);
  const renda = rec.reduce((t, x) => t + vv(x), 0);
  const faltaV = desp.filter(x => semValor(x) && !feito(x));
  const ccTot = noCartao.reduce((t, f) => t + num(f.valor), 0);
  const cats = {}; desp.forEach(x => { cats[x.cat || 'Outros'] = (cats[x.cat || 'Outros'] || 0) + vv(x); });
  const catArr = Object.entries(cats).filter(c => c[1] > 0).sort((a, b) => b[1] - a[1]), maxCat = catArr.length ? catArr[0][1] : 1;
  const status = x => {
    const r = x.tipo === 'receita';

    if (x.status === 'anterior') return `<span class="st st-int" title="Venceu antes de ${dm(S.cfg.inicio)}, quando o controle começou">Considerada ${r ? 'recebida' : 'paga'}</span>`;
    if (mi === 0) return x.data ? prazo(x.data).replace('Atrasado', r ? 'Atrasada' : 'Atrasada') : '<span class="st st-pend">Dia a confirmar</span>';
    return x.data ? '<span class="st st-pend">Prevista</span>' : '<span class="st st-pend">Dia a confirmar</span>';
  };
  const row = x => {
    const d = x.data ? parseD(x.data) : null, r = x.tipo === 'receita';
    const btn = mi === 0 && x.status === 'previsto' ? `<button class="btn-sm" type="button" data-baixa="${esc(x.id)}">${r ? 'Recebi' : 'Paguei'}</button>` : '';
    return `<div class="row">
      <div class="datebox">${d ? `<b>${d.getDate()}</b><span>${MES[d.getMonth()]}</span>` : '<b>?</b><span>dia</span>'}</div>
      <div class="r-main"><div class="r-title">${esc(x.desc)}</div>
        <div class="r-meta"><span>${esc(x.cat)}</span>${tagParcela(x)}${status(x)}${x.confirmar && x.status !== 'realizado' ? `<span class="st st-conf" title="${esc(x.confirmar)}">Confirmar: ${esc(x.confirmar)}</span>` : ''}</div></div>
      <div class="r-right"><span class="r-val ${r ? 'pos' : ''}">${semValor(x) && x.status !== 'realizado' ? '<span class="faint">valor a informar</span>' : (x.est && x.status !== 'realizado' ? '≈ ' : '') + money(vv(x))}</span>${btn}</div>
    </div>`;
  };
  const seg = (arr, key, cur) => `<div class="seg" role="group">${arr.map(([kk, l]) => `<button type="button" data-f="${key}:${kk}" aria-pressed="${String(cur) === String(kk)}">${l}</button>`).join('')}</div>`;
  return `
  <div class="toolbar">
    ${seg(MESES.map((x, i) => [i, cap(MES[mi0(x)]) + (x.slice(0, 4) !== MES_ATUAL.slice(0, 4) ? '/' + x.slice(2, 4) : '')]), 'fxMes', mi)}
    <span class="note">Pessoa física · Beecom e música ficam para depois</span>
  </div>
  <div class="kpis">
    <section class="card kpi"><div class="k-l">Contas do mês</div><div class="k-v">${money(total)}</div><div class="k-s">${desp.length} contas${faltaV.length ? `, ${faltaV.length} sem valor` : ''}</div></section>
    <section class="card kpi"><div class="k-l">Já pago</div><div class="k-v">${money(pago)}</div><div class="k-s">${desp.filter(feito).length} de ${desp.length}</div></section>
    <section class="card kpi"><div class="k-l">Renda recorrente</div><div class="k-v pos">${money(renda)}</div><div class="k-s">${rec.length} fontes</div></section>
    <section class="card kpi"><div class="k-l">Peso na renda</div><div class="k-v ${renda && total / renda > .5 ? 'neg' : ''}">${renda ? Math.round(total / renda * 100) + '%' : '—'}</div><div class="k-s">${renda ? 'sem a fatura: ' + Math.round(semFat / renda * 100) + '%' : 'sem renda no mês'}</div></section>

      <div class="card-h"><h2>Contas de ${MES_LONGO[m - 1]} de ${y}</h2><span class="tag faint">${money(total)}</span></div>
      <div class="rows">${desp.map(row).join('')}</div>
      ${noCartao.length ? `<div class="group-h" style="margin-top:14px"><h3>No cartão, já dentro da fatura</h3><span>${money(ccTot)} por mês</span></div>
      <div class="rows">${noCartao.map(f => `<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><div class="r-main"><div class="r-title">${esc(f.desc)}</div><div class="r-meta"><span>${esc(f.cat || '')}</span><span>${esc(contaNome('cartao'))}</span>${f.confirmar ? `<span class="st st-conf">Confirmar: ${esc(f.confirmar)}</span>` : ''}</div></div><div class="r-right"><span class="r-val">${f.aprox ? '≈ ' : ''}${money(num(f.valor))}</span></div></div>`).join('')}</div>
      <p class="note" style="margin-top:10px">Elas não somam de novo no total do mês, para não contar duas vezes.</p>` : ''}
    </section>
    <div class="stack s5">

        <div class="rows">${rec.map(row).join('') || '<p class="note">Nenhuma receita recorrente.</p>'}</div>
      </section>
      <section class="card">

      </section>
    </div>
  </div>`;
}

/* ===================== sazonalidade =====================
   Mês a mês pelo dinheiro que entrou e saiu das contas, no cenário base.
   Compras no cartão entram pela fatura, no mês em que ela vence, para não contar duas vezes.
   Meses antes do início do controle aparecem só com lançamentos reais (extratos importados, origem "extrato"). */
let SZ = null;
function classeSaz(it) {
  if (it.tipo === 'receita') return 'in';
  if (it.tipo === 'despesa') return isCartao(it.conta) ? null : 'out';
  if (it.tipo === 'fatura') return 'out';
  if (it.tipo === 'aporte' || it.tipo === 'resgate' || it.tipo === 'rendimento') return 'res';
  return null;
}
const catSaz = (it, c) => c === 'res' ? ({ aporte: 'Guardado', resgate: 'Tirado da reserva', rendimento: 'Rendimento' })[it.tipo]
  : it.tipo === 'fatura' ? 'Cartão' : (it.cat || (c === 'in' ? 'Outras entradas' : 'Outros gastos'));
const nomeMes = k => MES_LONGO[mi0(k)] + (k.slice(0, 4) !== MES_ATUAL.slice(0, 4) ? '/' + k.slice(2, 4) : '');
const temExtrato = k => S.lanc.some(l => l.origem === 'extrato' && l.status === 'realizado' && ym(dataEf(l)) === k);
function mesesSaz(soReal) {
  let first = ym(S.cfg.inicio), last = soReal ? MES_ATUAL : MESES[MESES.length - 1];
  for (const l of S.lanc) if (l.status === 'realizado' && classeSaz(l)) { const k = ym(dataEf(l)); if (k < first) first = k; if (k > last) last = k; }
  const ini = ym(S.cfg.inicio), comDado = new Set(S.lanc.filter(l => l.status === 'realizado' && classeSaz(l)).map(l => ym(dataEf(l))));
  const out = [];
  for (let k = first; k <= last; k = addMes(k, 1)) if (k >= ini || comDado.has(k)) out.push(k);
  return out.slice(-24);
}
function dadosSaz(soReal) {
  const meses = mesesSaz(soReal), set = new Set(meses), ini = ym(S.cfg.inicio), its = [], semV = [], vistos = new Set();
  const push = (it, k, real) => {
    const c = classeSaz(it); if (!c || !set.has(k)) return;
    if (!real && semValor(it)) { semV.push(it.desc); return; }
    const v = real ? num(it.valor) : vCen(it, 1);
    if (!v) return;
    its.push({ k, c, cat: catSaz(it, c), v: it.tipo === 'resgate' ? -v : v, real, desc: it.desc });
  };
  for (const l of S.lanc) if (l.status === 'realizado') push(l, ym(dataEf(l)), true);
  if (!soReal) {
    for (const k of meses) if (k >= ini) for (const it of ocorrencias(k)) if (it.status !== 'realizado') { vistos.add(it.id); push(it, k, false); }
    for (const l of avulsos()) {
      if (vistos.has(l.id) || String(l.ref || '').startsWith('fatcc-')) continue;
      push(l, l.data && ym(l.data) > MES_ATUAL ? ym(l.data) : MES_ATUAL, false);
    }
  }
  const tot = {}, cats = { in: [], out: [], res: [] };
  for (const k of meses) tot[k] = { in: 0, out: 0, res: 0, inR: 0, outR: 0 };
  for (const x of its) {
    tot[x.k][x.c] += x.v; if (x.real && x.c !== 'res') tot[x.k][x.c + 'R'] += x.v;
    let c = cats[x.c].find(y => y.cat === x.cat);
    if (!c) cats[x.c].push(c = { cat: x.cat, s: 0, m: {} });
    c.s += x.v;
    const m = c.m[x.k] || (c.m[x.k] = { v: 0, r: 0, its: [] });
    m.v += x.v; if (x.real) m.r += x.v; m.its.push(x);
  }
  for (const c in cats) cats[c].sort((a, b) => Math.abs(b.s) - Math.abs(a.s));
  for (const k of meses) for (const c in tot[k]) tot[k][c] = r2(tot[k][c]);
  return { meses, its, semV: [...new Set(semV)], tot, cats, soReal };
}
/* situação de cada um dos últimos 12 meses: com dados reais, parcial ou faltando extrato */
function coberturaSaz() {
  const ini = S.cfg.inicio, kIni = ym(ini), out = [];
  for (let j = 11; j >= 0; j--) {
    const k = addMes(MES_ATUAL, -j);
    let st = 'falta';
    if (temExtrato(k)) st = 'ok';
    else if (k > kIni) st = 'ok';
    else if (k === kIni) st = parseD(ini).getDate() > 1 ? 'parc' : 'ok';
    else if (S.lanc.some(l => l.status === 'realizado' && classeSaz(l) && ym(dataEf(l)) === k)) st = 'parc';

}

  if (ms.length > 1 && pesado) {

    al('idea', 'idea', `<b>${cap(nomeMes(pesado))}</b> é o mês mais pesado: ${money(T[pesado].out)} de saídas, ${money(T[pesado].out - mOut)} acima da média.${acima.length ? ` Ficam acima do normal: ${listaPt(acima.map(x => `${esc(x.cat.toLowerCase())} (${money(x.d, true)})`))}.` : ''}`);

  if (!soReal) {

    const fim = ativas().filter(f => !f.cartao && f.ate && f.ate >= MES_ATUAL && f.ate <= limite && valorFixa(f) && (f.tipo === 'despesa' || f.tipo === 'receita'));

function ticks(min, max, n) {

  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, out = [];
  for (let v = lo; v <= hi + 1e-6; v += step) out.push(v);

}

function drawSaz() {
  const el = document.getElementById('saz-chart'); if (!el || !SZ) return;
  const M = SZ.meses, T = SZ.tot, n = M.length;
  const w = el.clientWidth || 700, h = w < 520 ? 220 : 300, ml = 58, mr = 6, mt = 12, mb = 30;
  const tk = ticks(0, Math.max(1, ...M.flatMap(k => [T[k].in, T[k].out])), 4);
  const topV = tk[tk.length - 1], Y = v => mt + (1 - Math.max(0, v) / topV) * (h - mt - mb), y0 = Y(0);
  const band = (w - ml - mr) / n, bw = Math.max(3, Math.min(28, (band * .72 - 2) / 2));
  const cx = i => ml + band * (i + .5);
  /* barra de yb (base) até yt (topo), só o topo arredondado */
  const bar = (x, yb, yt, round) => {
    const hg = yb - yt; if (hg <= .4) return '';
    const r = round ? Math.min(4, bw / 2, hg) : 0;
    return `M${x.toFixed(1)} ${yb.toFixed(1)}V${(yt + r).toFixed(1)}` + (r ? `A${r} ${r} 0 0 1 ${(x + r).toFixed(1)} ${yt.toFixed(1)}H${(x + bw - r).toFixed(1)}A${r} ${r} 0 0 1 ${(x + bw).toFixed(1)} ${(yt + r).toFixed(1)}` : `H${(x + bw).toFixed(1)}`) + `V${yb.toFixed(1)}Z`;
  };
  const marks = M.map((k, i) => ['in', 'out'].map(c => {
    const tot = Math.max(0, T[k][c]), real = Math.min(tot, Math.max(0, T[k][c + 'R'])), prev = tot - real;
    const x = c === 'in' ? cx(i) - 1 - bw : cx(i) + 1, yr = Y(real);
    const solid = real > 0 ? `<path d="${bar(x, y0, prev > 0.5 ? yr + 1 : yr, prev <= 0.5)}" fill="var(--sz-${c})"/>` : '';
    const hatch = prev > 0.5 ? `<path d="${bar(x, real > 0 ? yr - 1 : y0, Y(tot), true)}" fill="url(#szp-${c})" stroke="var(--sz-${c})" stroke-width="1" stroke-opacity=".8"/>` : '';
    return solid + hatch;
  }).join('')).join('');
  const every = band < 34 ? 2 : 1;
  const lbls = M.map((k, i) => (n - 1 - i) % every ? '' : `<text x="${cx(i)}" y="${h - 9}" text-anchor="middle" font-size="11.5" ${k === MES_ATUAL ? 'font-weight="700" fill="var(--text)"' : 'fill="var(--text-3)"'}>${rotMes(k, true)}</text>`).join('');
  const pat = c => `<pattern id="szp-${c}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--sz-${c})" fill-opacity=".2"/><rect width="1.6" height="5" fill="var(--sz-${c})" fill-opacity=".75"/></pattern>`;
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" height="${h}" role="img" aria-label="Entradas e saídas por mês, de ${nomeMes(M[0])} a ${nomeMes(M[n - 1])}">
    <defs>${pat('in')}${pat('out')}</defs>
    <rect class="sz-hl" y="${mt - 4}" height="${y0 - mt + 4}" rx="8" fill="var(--panel-2)" style="opacity:0"/>
    ${tk.map(v => `<line x1="${ml}" x2="${w - mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v === 0 ? 'var(--line-2)' : 'var(--line)'}"/><text x="${ml - 10}" y="${Y(v) + 4}" text-anchor="end" font-size="11.5" fill="var(--text-3)">${moneyK(v)}</text>`).join('')}
    ${marks}${lbls}
    <rect x="${ml}" y="0" width="${w - ml - mr}" height="${h}" fill="transparent"/></svg>`;
  const svg = el.querySelector('svg'), hl = svg.querySelector('.sz-hl');
  const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; el.appendChild(tip);
  const ja = (v, r, verbo) => r > 0.004 && v - r > 0.5 ? ` <span>(${verbo} ${money(r)})</span>` : '';
  const move = ev => {
    const r = svg.getBoundingClientRect(), x = ev.clientX - r.left;
    const i = Math.max(0, Math.min(n - 1, Math.floor((x - ml) / band))), k = M[i], t = T[k];
    hl.setAttribute('x', ml + band * i + 2); hl.setAttribute('width', Math.max(0, band - 4)); hl.style.opacity = 1;
    tip.innerHTML = `<b>${cap(nomeMes(k))}</b><br>Entradas: ${money(t.in)}${ja(t.in, t.inR, 'já entrou')}<br>Saídas: ${money(t.out)}${ja(t.out, t.outR, 'já saiu')}<br>Sobra: <b>${money(t.in - t.out, true)}</b>`;
    tip.hidden = false;
    const tw = tip.offsetWidth, left = Math.min(Math.max(cx(i), tw / 2 + 4), r.width - tw / 2 - 4);
    tip.style.left = left + 'px'; tip.style.top = Math.max(Y(Math.max(t.in, t.out)), 40) + 'px';
  };
  const leave = () => { tip.hidden = true; hl.style.opacity = 0; };
  svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move); svg.addEventListener('pointerleave', leave);
}

function fecharBaixa() { S.baixa = null; const el = document.getElementById('sheet'); el.hidden = true; el.innerHTML = ''; }
async function confirmarBaixa() {
  const it = S.baixa.it;
  const vIn = parseNum(document.getElementById('bx-v').value);
  const v = isFinite(vIn) && vIn > 0 ? r2(vIn) : (!it.est && !semValor(it) ? vCen(it, 1) : NaN);
  const conta = document.getElementById('bx-c').value;
  const data = document.getElementById('bx-d').value || TODAY;
  if (!isFinite(v) || v <= 0) return renderBaixa('Informe o valor.');
  if (!conta) return renderBaixa('Escolha a conta.');
  const now = new Date().toISOString();
  try {
    if (it.gerado) {
      const id = it.ref.replace(/:/g, '-');
      const doc = { ref: it.ref, data: it.data || data, desc: it.desc, tipo: it.tipo, cat: it.cat || '', grupo: it.grupo || null, valor: v, conta, status: 'realizado', baixa: data, origem: 'painel', criado: now };
      if (MOV.includes(it.tipo)) doc.contaDest = it.contaDest || resId();
      await S.db.doc('lanc/' + id).set(doc);
      S.undo = { tipo: 'del', ids: [id] };
    } else {
      const prev = { status: it.status || 'previsto', baixa: it.baixa ?? null, valor: it.valor ?? null, conta: it.conta ?? null };
      await S.db.doc('lanc/' + it.id).update({ status: 'realizado', baixa: data, valor: v, conta, atualizado: now });
      S.undo = { tipo: 'upd', id: it.id, prev };
    }
    fecharBaixa();
    toast(`Baixa feita: ${esc(it.desc)}, ${money(v)}.`);
  } catch (e) {
    renderBaixa(e && e.code === 'invalid_argument' ? 'Você pode ver estes dados, mas não alterar.' : 'Não consegui salvar agora. Tente de novo.');
  }
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function micOk() {
  if (!SR || S.micOff || store.get('bili-mic') === 'off') return false;
  /* dentro do Claude o painel roda num quadro sem acesso ao microfone: nem tenta gravar */
  try { if (window.self !== window.top) return false; } catch (e) { return false; }
  try { const p = document.permissionsPolicy || document.featurePolicy; if (p && p.allowsFeature && !p.allowsFeature('microphone')) return false; } catch (e) {}
  return true;
}
function micDesligar(msg) { S.micOff = true; S.micMsg = msg; S.ditando = true; store.set('bili-mic', 'off'); }
/* sem microfone liberado para o painel, o botão vira um atalho para o ditado do próprio aparelho:
   1º clique abre o campo e mostra como ditar; 2º clique interpreta o que foi dito */
const UA = navigator.userAgent || '', PLAT = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
const EH_CEL = /Android|iPhone|iPad|iPod|Mobile/i.test(UA), EH_MAC = !EH_CEL && /Mac/i.test(PLAT), EH_WIN = !EH_CEL && /Win/i.test(PLAT);
function dicaDitado() {
  const pre = 'O painel não grava sozinho: quem ouve é o ditado do aparelho. ';
  if (EH_CEL) return pre + 'Toque no <b>microfone do teclado</b>, fale e toque em <b>Terminei</b>.';
  if (EH_MAC) return pre + 'Aperte a <b>tecla do microfone</b> do teclado (ou <b>Fn</b> duas vezes) para o Mac começar a ouvir. Fale, aperte de novo para parar e clique em <b>Terminei</b>.';
  if (EH_WIN) return pre + 'Aperte <b>Windows + H</b> para o Windows começar a ouvir. Fale, aperte de novo para parar e clique em <b>Terminei</b>.';
  return pre + 'Use o ditado do seu computador para falar no campo e clique em <b>Terminei</b>.';
}
function micBtn() {
  const on = !!(S.ouvindo || S.ditando);
  const txt = S.ouvindo ? 'Gravando… clique para parar' : S.ditando ? 'Terminei' : 'Falar';
  return `<button type="button" class="mic-btn${on ? ' on' : ''}" id="mic" aria-pressed="${on}">${icon(S.ditando ? 'check' : 'lancar')}<span>${txt}</span></button>`;
}
function ditado() {
  if (S.ditando) {
    S.ditando = false; S.micMsg = null;
    const ta = document.getElementById('fala'), txt = ta ? ta.value : '';
    S.draft = Object.assign(S.draft || {}, { texto: txt });
    render(true);
    if (txt.trim()) interpretar(); else focarFala();
    return;
  }
  S.ditando = true; render(true); focarFala();
}
function ouvir() {
  if (S.ouvindo && S.rec) { S.rec.stop(); return; }
  const ta = document.getElementById('fala'), base = ta.value.trim() ? ta.value.trim() + ' ' : '';
  let rec;
  try { rec = new SR(); } catch (e) { micDesligar('O navegador não liberou o microfone para o painel.'); render(true); focarFala(); return; }
  rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = false;
  let falou = false;
  rec.onresult = e => { let t = ''; for (const r of e.results) t += r[0].transcript; ta.value = base + t; falou = true; S.draft = Object.assign(S.draft || {}, { texto: ta.value }); };
  rec.onerror = e => {
    if (['not-allowed', 'service-not-allowed', 'audio-capture', 'network'].includes(e.error))
      micDesligar('O navegador não liberou o microfone para o painel.');
  };
  let abriu = false;
  rec.onstart = () => { abriu = true; };
  rec.onend = () => { clearTimeout(S.recT); S.ouvindo = false; S.rec = null; render(true); if (falou && document.getElementById('fala').value.trim()) interpretar(); };
  try { rec.start(); S.ouvindo = true; S.rec = rec; } catch (e) { micDesligar('O navegador não liberou o microfone para o painel.'); }
  /* se o microfone não abrir em alguns segundos, desiste e mostra o caminho pelo teclado */
  clearTimeout(S.recT);
  S.recT = setTimeout(() => { if (S.rec === rec && !abriu) { micDesligar('O microfone não abriu.'); try { rec.abort(); } catch (e) {} S.ouvindo = false; S.rec = null; render(true); } }, 8000);
  render(true);
  const t2 = document.getElementById('fala'); if (t2 && !S.ouvindo) t2.focus();
}
function focarFala() { const ta = document.getElementById('fala'); if (ta) { try { ta.focus({ preventScroll: true }); } catch (e) { ta.focus(); } } }

const CONTAS_OPC = () => idsCaixa().concat(idsCartao().length ? idsCartao() : ['cartao']).concat(idsReserva());
function promptIA(txt) {
  const hoje = parseD(TODAY);
  const fx = ativas().map(f => `${f.id} = ${f.desc} (${f.tipo}${f.valor != null ? ', R$ ' + f.valor : ''}${f.dia ? ', dia ' + f.dia : ''}${f.cartao ? ', no cartão' : ''})`).join('; ');
  return `Você interpreta frases faladas sobre dinheiro e devolve lançamentos estruturados para o controle financeiro pessoal (pessoa física) do Filipe, no Brasil.
Hoje é ${SEM[hoje.getDay()]}, ${dm(TODAY)}/${hoje.getFullYear()}. Datas no formato AAAA-MM-DD.
Contas: ${idsCaixa().map(k => k + ' = conta ' + contas()[k].nome).join('; ')}; ${idsCartao().map(k => k + ' = ' + contaNome(k) + ' (crédito)').join('; ')}; ${idsReserva().map(k => k + ' = ' + contas()[k].nome + ' (reserva)').join('; ')}.
Contas fixas e receitas recorrentes já cadastradas: ${fx}.
Saldos que o painel calcula hoje: ${[...idsCaixa(), ...idsReserva()].map(k => contas()[k].nome + ' R$ ' + r2(saldosAte(null).s[k])).join('; ')}.
Tipos: receita, despesa, fatura (pagamento da fatura do cartão), aporte (guardar na reserva), resgate (tirar da reserva), rendimento, transferencia (entre as contas correntes), ajuste (atualizar ou corrigir o saldo de uma conta: "o saldo do Nubank é 1.090,72", "atualiza o Sicoob para 3.100", "tenho 900 no Nubank").
Status: realizado (já aconteceu) ou previsto (vai acontecer).
Regras:
- valor sempre positivo, em reais, número com ponto decimal. No ajuste, valor é o saldo novo da conta (pode ser negativo se a conta estiver no vermelho), status realizado e data de hoje, a não ser que a frase diga outra.
- Uma frase pode ter mais de um lançamento (ex.: o saldo de duas contas): devolva um item para cada.
- Nunca invente valor, data ou conta. Algo já realizado sem dizer o banco ou o cartão: conta null e preencha "faltando". "Cartão do Sicoob" ou "crédito do Sicoob" é o cartão, não a conta Sicoob. Compra no crédito sem dizer qual cartão: conta null e pergunte qual cartão.
- Se a frase for o pagamento ou recebimento de uma conta fixa cadastrada, preencha "fixa" com o id dela.
- Compra parcelada no cartão: um lançamento por parcela com o valor da parcela; a primeira na data da compra como realizado, as outras como previsto, uma por mês.
- Para algo futuro, "data" é o vencimento ou o dia previsto.
- aporte e resgate: informe conta (origem) e conta_destino.
- "descricao" curta, como numa planilha (ex.: "Combustível", "Telos").
Responda só com JSON neste formato:
{"lancamentos":[{"descricao":"Combustível","valor":120,"tipo":"despesa","categoria":"Transporte","conta":"cartao","conta_destino":null,"data":"${TODAY}","status":"realizado","fixa":null,"parcela":null,"total_parcelas":null}],"faltando":null}
Se faltar algo essencial: "faltando":{"campo":"conta","pergunta":"Pagou com qual banco?"} (campo: conta, valor ou data).

async function confirmar() {
  lerForm();
  if (soAjuste()) return confirmarAjuste();
  const ls = S.draft.res.lancs;
  const precisa = l => !l.conta && l.status === 'realizado';
  if (ls.some(l => !l.valor) || ls.some(precisa)) {
    S.draft.res.falt = ls.some(l => !l.valor) ? { campo: 'valor', pergunta: 'Qual foi o valor?' } : { campo: 'conta', pergunta: 'Em qual conta?' };
    document.getElementById('lan-result').innerHTML = confirmHtml(); return;
  }
  if (!S.db) { toast('Sem conexão com os dados agora. Me mande no chat que eu lanço.'); return; }
  const now = new Date().toISOString(), ids = [];
  try {
    for (const l of ls) {
      const doc = { data: l.data, desc: l.desc, valor: l.valor, tipo: l.tipo, cat: l.cat || '', conta: l.conta || null, status: l.status, origem: 'voz', texto: S.draft.texto, criado: now };
      if (l.status === 'realizado') doc.baixa = l.data;
      if (l.contaDest) doc.contaDest = l.contaDest;
      if (l.parcela) doc.parcela = l.parcela;
      if (l.ref) { doc.ref = l.ref; doc.grupo = l.grupo || null; }
      const ref = l.ref ? S.db.doc('lanc/' + l.ref.replace(/:/g, '-')) : S.db.collection('lanc').doc();
      await ref.set(doc);
      ids.push(ref.id);
    }
  } catch (e) {
    toast(e && e.code === 'invalid_argument' ? 'Você pode ver estes dados, mas não alterar.' : 'Não consegui salvar agora. Tente de novo.');
    return;
  }
  S.sessao.push(...ids);
  S.undo = { tipo: 'del', ids };
  const l = ls[0];
  const ef = l.status !== 'realizado' ? 'Entrou nas pendências.' : isCartao(l.conta) ? `Entra na fatura do ${esc(contaNome(l.conta))}.` : l.fixaNome ? `Baixa em ${esc(l.fixaNome)}.` : '';
  S.draft = null;
  toast(`Lançado: ${esc(l.desc)}, ${money(ls.reduce((t, x) => t + x.valor, 0))}. ${ef}`);
  render(true);
}

/* ===================== desfazer e aviso ===================== */
async function desfazer() {
  const u = S.undo; if (!u || !S.db) return;
  S.undo = null; hideToast();
  try {
    if (u.tipo === 'del') for (const id of u.ids) await S.db.doc('lanc/' + id).delete();
    else await S.db.doc('lanc/' + u.id).update(u.prev);
    S.sessao = S.sessao.filter(id => !(u.ids || []).includes(id));
  } catch (e) { toast('Não consegui desfazer.'); }
}
let toastT;
function toast(html) {
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${html}</span>${S.undo ? '<button type="button" id="undo">Desfazer</button>' : ''}`;
  t.hidden = false; clearTimeout(toastT); toastT = setTimeout(hideToast, 6500);
}
function hideToast() { document.getElementById('toast').hidden = true; }

/* ===================== eventos ===================== */
document.addEventListener('click', e => {
  if (e.target.id === 'sheet') return fecharBaixa();
  const t = e.target.closest('button, [data-go]'); if (!t) { document.getElementById('more').hidden = true; return; }
  if (t.id === 'more-btn') { const m = document.getElementById('more'); m.hidden = !m.hidden; t.setAttribute('aria-expanded', String(!m.hidden)); return; }
  if (t.dataset.go) { go(t.dataset.go); if (t.dataset.go === 'lancar' && !S.draft?.res) focarFala(); return; }
  if (t.id === 'mic') return S.ouvindo || micOk() ? ouvir() : ditado();
  if (t.dataset.baixa) return abrirBaixa(t.dataset.baixa);
  if (t.id === 'bx-ok') return confirmarBaixa();
  if (t.id === 'bx-x' || t.id === 'bx-x2') return fecharBaixa();
  if (t.dataset.f) { const [k, v] = t.dataset.f.split(':'); S.f[k] = /^\d+$/.test(v) ? Number(v) : v; render(true); return; }
  if (t.dataset.ex !== undefined) { const ta = document.getElementById('fala'); ta.value = EXEMPLOS[+t.dataset.ex]; S.draft = { texto: ta.value }; document.getElementById('lan-result').innerHTML = ''; interpretar(); return; }
  if (t.dataset.conta) { lerForm(); S.draft.res.lancs.forEach(l => { if (!l.conta || S.draft.res.falt) l.conta = t.dataset.conta; }); S.draft.res.falt = soAjuste() ? faltaAjuste(S.draft.res.lancs).falt : null; document.getElementById('lan-result').innerHTML = confirmHtml(); return; }
  if (t.id === 'interpretar') { if (S.ditando) { S.ditando = false; S.micMsg = null; render(true); } return interpretar(); }
  if (t.id === 'confirmar') return confirmar();
  if (t.id === 'descartar') { S.draft = null; document.getElementById('lan-result').innerHTML = ''; const ta = document.getElementById('fala'); ta.value = ''; ta.focus(); return; }
  if (t.id === 'undo') return desfazer();
  if (t.id === 'eye') { S.hidden = !S.hidden; store.set('bili-hidden', S.hidden ? '1' : '0'); render(true); return; }
});
document.addEventListener('input', e => {
  if (e.target.id === 'busca') { S.f.busca = e.target.value; renderExtratoList(); }
  if (e.target.id === 'fala') { S.draft = Object.assign(S.draft || {}, { texto: e.target.value }); }
  if (/^aj-[cv]\d+$/.test(e.target.id) && soAjuste()) { lerForm(); S.draft.res.lancs.forEach((l, i) => { const p = document.getElementById('aj-i' + i); if (p) p.innerHTML = infoAjuste(l); }); }
});
document.addEventListener('focusout', () => { if (renderPend) setTimeout(() => { if (renderPend) agendar(); }, 150); });
document.addEventListener('keydown', e => {
  if (e.target.id === 'fala' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (S.ditando) { S.ditando = false; S.micMsg = null; render(true); } interpretar(); }
  if (e.key === 'Escape' && S.baixa) fecharBaixa();
  if (e.key === 'Enter' && S.baixa && e.target.closest && e.target.closest('#sheet') && e.target.tagName === 'INPUT') { e.preventDefault(); confirmarBaixa(); }
});
window.addEventListener('scroll', () => document.getElementById('top').classList.toggle('scrolled', window.scrollY > 4), { passive: true });
let rzT, lastW = 0;
new ResizeObserver(ents => { const w = Math.round(ents[0].contentRect.width); if (w === lastW) return; lastW = w; clearTimeout(rzT); rzT = setTimeout(afterRender, 80); }).observe(document.getElementById('view'));
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== S.view && VIEWS[h]) go(h); });

go(VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'inicio', true);
</script>
